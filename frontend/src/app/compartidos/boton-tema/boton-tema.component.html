<button
  class="boton-tema"
  type="button"
  (click)="alternar()"
  title="Cambiar tema"
  aria-label="Cambiar tema"
>
  <svg
    class="oscuro"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.6"
  >
    <rect x="2" y="5" width="20" height="14" rx="2" />
    <circle cx="7" cy="9" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="12" cy="9" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="17" cy="9" r="1.2" fill="currentColor" stroke="none" />
    <line x1="7" y1="13" x2="7" y2="16" />
    <line x1="12" y1="13" x2="12" y2="16" />
    <line x1="17" y1="13" x2="17" y2="16" />
    <line x1="4" y1="13" x2="20" y2="13" />
  </svg>
  <svg class="claro" viewBox="0 0 20 20" fill="none">
    <text x="1" y="7">1</text>
    <text x="1" y="13" opacity=".6">0</text>
    <text x="5" y="4">0</text>
    <text x="5" y="10" opacity=".6">F</text>
    <text x="9" y="9">A</text>
    <text x="9" y="15" opacity=".55">7</text>
    <text x="13" y="5">9</text>
    <text x="13" y="11" opacity=".6">C</text>
    <text x="17" y="8">E</text>
    <text x="17" y="14" opacity=".55">5</text>
  </svg>
</button>
